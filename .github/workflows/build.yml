name: Android CI Bionic

on:
  push:
    branches:
      - "ludashi-3.1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Adrenotools
      # --------------------------------------------------

      - name: Clone libadrenotools
        run: |
          rm -rf app/src/main/cpp/adrenotools

          git clone https://github.com/Pipetto-crypto/libadrenotools.git \
            app/src/main/cpp/adrenotools

          cd app/src/main/cpp/adrenotools

          git checkout 8483dfdaa2abf97ee89ad0e5f337e7b508550c6b

      - name: Clone linkernsbypass
        run: |
          mkdir -p app/src/main/cpp/adrenotools/lib

          git clone https://github.com/Pipetto-crypto/liblinkernsbypass.git \
            app/src/main/cpp/adrenotools/lib/linkernsbypass

      # --------------------------------------------------
      # Java
      # --------------------------------------------------

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      # --------------------------------------------------
      # Dependências
      # --------------------------------------------------

      - name: Install Shader Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # --------------------------------------------------
      # Build
      # --------------------------------------------------

      - name: Build Debug APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      # --------------------------------------------------
      # Renomear APK
      # --------------------------------------------------

      - name: Prepare APK
        run: |
          mkdir -p release

          cp app/build/outputs/apk/debug/app-debug.apk \
             release/Winlator-Ludashi-turbo-debug.apk

      # --------------------------------------------------
      # Artifact
      # --------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Ludashi-turbo-debug
          path: release/Winlator-Ludashi-turbo-debug.apk

      # --------------------------------------------------
      # Criar Release
      # --------------------------------------------------

      - name: Generate release tag
        id: tag
        run: |
          echo "tag=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Winlator Ludashi Turbo ${{ steps.tag.outputs.tag }}"
          body: |
            ## Winlator Ludashi Turbo

            Build automática da branch `ludashi-3.1`.

            ### APK
            - Winlator-Ludashi-turbo-debug.apk

            ### Build
            - Commit: `${{ github.sha }}`
            - Run: `${{ github.run_number }}`
            - Branch: `${{ github.ref_name }}`

          files: |
            release/Winlator-Ludashi-turbo-debug.apk
          draft: false
          prerelease: true
